<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Dialog — Desktop (Framework B)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ─────────────────────────────────────────────────────────────
     Unit system — desktop (viewport ≥ 768)
     디자인 기준 폭: 1920

     1) Typography
        font-size = (size value − 1) × 0.0083 × screen width + 1rem
        · size value = rem (1rem = 14px), 0.0083 × screen width = 0.83vw
        · size value ≤ 1rem(14px) 은 뷰포트와 무관하게 px 고정
     2) Spacing
        · mid-* : (값 − 8) × 100vw / 1920 + 8, 값 < 8 이면 값 그대로 고정
        · px-*  : px 고정 — 이 화면에는 해당 없음
     3) 다이얼로그 box — 세 가지 안을 토글로 비교
        · 560 + mid : 너비 560px 고정 + 내부 여백 mid-* (가변)   ← 기본
        · 560 + px  : 너비 560px 고정 + 내부 여백 px 고정 (@1920 값)
        · vw + mid  : 너비 29.1667vw 가변 + 내부 여백 mid-* (가변)
          29.1667vw = 560 / 1920 → 1920 에서 560px
     4) 버튼 padding = em (해당 버튼의 label 사이즈 기준)
     5) 그 외 = px
     6) Font — 영문 Work Sans / 국문 Pretendard (--font 스택의 폴백으로 자동 분기)
     ※ 헤더 타이틀은 우하단 데모 패널에서 P1~P4 로 바꿔 볼 수 있다 (기본 = 시안값 P2).
       P1/P2 는 1rem 초과라 가변, P3(1rem)/P4(0.929rem) 는 고정이다.
     ───────────────────────────────────────────────────────────── */
  :root {
    /* 기준 단위 -------------------------------------------------- */
    --us: calc(100vw / 1920);       /* spacing 1px (mid-* 계산용) */

    /* Typography ------------------------------------------------- */
    --fs-c2:    12px;               /* caption-2          0.857rem → 고정 */
    --fs-p4:    13px;               /* paragraph-4        0.929rem → 고정 */
    --fs-p3:    14px;               /* paragraph-3        1rem     → 고정 */
    --fs-btn-l: 13px;               /* button-label-large 0.929rem → 고정 */
    --fs-p2:    calc((1.1429 - 1) * 0.83vw + 1rem);   /* paragraph-2 16px @1920 — 가변 */
    --fs-p1:    calc((1.2857 - 1) * 0.83vw + 1rem);   /* paragraph-1 18px @1920 — 가변 */

    /* 헤더 타이틀 사이즈 — 시안 기본값은 P2 */
    --fs-title: var(--fs-p2);

    /* Spacing — mid-* : (값 − 8) × 100vw / 1920 + 8 ---------------- */
    --mid-4:  4px;                  /* 값 < 8 → 값 그대로 고정 */
    --mid-8:  8px;                  /* 공식 결과도 8px (증감 없음) */
    --mid-12: calc( 4 * var(--us) + 8px);
    --mid-16: calc( 8 * var(--us) + 8px);
    --mid-24: calc(16 * var(--us) + 8px);

    /* 다이얼로그 box ---------------------------------------------- */
    --dialog-w-fixed: 560px;              /* 고정 안 */
    --dialog-w-fluid: 29.1667vw;          /* 가변 안 — 560 / 1920, 1920 에서 560px */
    --dialog-w: var(--dialog-w-fixed);    /* 기본 = 고정 */
    --dialog-h: 800px;

    /* Font / Color ----------------------------------------------- */
    /* 영문 = Work Sans, 국문 = Pretendard.
       Work Sans 에 한글 글리프가 없어 한글만 Pretendard 로 폴백된다. */
    --font: "Work Sans", "Pretendard Variable", Pretendard, sans-serif;
    --c-text: #111;
    --c-helper: rgba(17, 17, 17, 0.6);
    --c-line: rgba(0, 0, 0, 0.1);
    --c-line-strong: rgba(0, 0, 0, 0.12);
    --c-dim: rgba(0, 0, 0, 0.5);
  }

  /* 다이얼로그 box 안 전환 (데모) — --dialog-w 와 mid-* 만 덮어쓴다 */
  body[data-box="fixed-px"] {         /* 내부 여백을 @1920 값으로 고정 */
    --mid-4:  4px;
    --mid-8:  8px;
    --mid-12: 12px;
    --mid-16: 16px;
    --mid-24: 24px;
  }
  body[data-box="fluid-mid"] { --dialog-w: var(--dialog-w-fluid); }

  /* 헤더 타이틀 사이즈 전환 (데모) */
  body[data-title="p1"] { --fs-title: var(--fs-p1); }
  body[data-title="p2"] { --fs-title: var(--fs-p2); }
  body[data-title="p3"] { --fs-title: var(--fs-p3); }
  body[data-title="p4"] { --fs-title: var(--fs-p4); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    font-size: 14px;               /* 1rem = 14px */
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: var(--font);
    color: var(--c-text);
    background: #fff;
    word-break: keep-all;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  img { display: block; }

  .dim { position: absolute; inset: 0; z-index: 1; background: var(--c-dim); }

  /* ── dialog ──────────────────────────────────────────────────── */
  .dialog {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: var(--dialog-w);        /* 고정 560px / 가변 29.1667vw */
    height: var(--dialog-h);       /* 800px — 토큰 없음 → px */
    max-height: min(var(--dialog-h), 100%);
    overflow: hidden;
    background: #fff;
  }

  /* ── header ──────────────────────────────────────────────────── */
  .dialog .header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: var(--mid-8);
    width: 100%;
    /* 시안: pt mid-16 / pr mid-16 / pb mid-8 / pl mid-24 (좌우 비대칭) */
    padding: var(--mid-16) var(--mid-16) var(--mid-8) var(--mid-24);
    background: #fff;
    overflow: hidden;
  }
  .dialog .header .title {
    flex: 1 0 0;
    min-width: 0;
    font-weight: 500;
    font-size: var(--fs-title);    /* 기본 P2 = 16px @1920 — 가변 */
    line-height: 1.6;
    color: var(--c-text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 32px;                   /* 토큰 없음 → px */
    height: 32px;
  }
  .icon-btn .glyph { position: relative; width: 24px; height: 24px; overflow: hidden; }
  .icon-btn .glyph img { position: absolute; inset: 29.85%; width: auto; height: auto; max-width: none; }

  /* ── contentArea ─────────────────────────────────────────────── */
  .body {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }
  .body .content {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--mid-24);
    width: 100%;
    padding: var(--mid-16) var(--mid-24) var(--mid-24);
  }

  /* productList ------------------------------------------------- */
  .product {
    display: flex;
    align-items: flex-start;
    gap: 16px;                     /* 토큰 없음 → px */
    width: 100%;
  }
  .product .thumb {
    flex-shrink: 0;
    position: relative;
    width: 56px;                   /* 토큰 없음 → px */
    aspect-ratio: 1 / 1;
  }
  .product .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .product .text-area { flex: 1 0 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .product .name {
    width: 100%;
    font-weight: 500;
    font-size: var(--fs-p4);       /* 13px — 고정 */
    line-height: 1.6;
    color: var(--c-text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .product .option {
    display: flex;
    align-items: center;
    gap: 2px;                      /* 토큰 없음 → px */
    font-size: var(--fs-p4);       /* 13px — 고정 */
    line-height: 1.6;
    color: var(--c-text);
    white-space: nowrap;
  }
  .product .option span { opacity: 0.5; }

  .divider { width: 100%; height: 1px; background: var(--c-line); }

  /* rating ------------------------------------------------------ */
  .rating {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;                      /* 토큰 없음 → px */
    width: 100%;
    padding: var(--mid-12) 0;
  }
  .rating .stars { display: flex; justify-content: center; gap: var(--mid-4); width: 100%; }
  .rating .star {
    position: relative;
    flex-shrink: 0;
    width: 40px;                   /* 토큰 없음 → px */
    height: 40px;
    overflow: hidden;
    cursor: pointer;
  }
  .rating .star img {
    position: absolute;
    inset: 6.25% 8.4% 14.61% 8.39%;
    width: auto;
    height: auto;
    max-width: none;
  }

  /* multiLine --------------------------------------------------- */
  .multi-line {
    display: flex;
    flex-direction: column;
    gap: var(--mid-12);
    width: 100%;
    height: 216px;                 /* 토큰 없음 → px */
  }
  .multi-line .text-field {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    width: 100%;
    padding: 14px 17px;            /* 토큰 없음 → px */
    border: 1px solid var(--c-line-strong);
    overflow: hidden;
  }
  .multi-line textarea {
    flex: 1 0 0;
    min-width: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: none;
    resize: none;
    font: inherit;
    font-size: var(--fs-p4);       /* 13px — 고정 */
    line-height: 1.6;
    color: var(--c-text);
  }
  .multi-line textarea:focus { outline: none; }
  .multi-line .supporting {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--mid-8);
    width: 100%;
  }
  .multi-line .counter {
    min-width: 80px;               /* 토큰 없음 → px */
    font-size: var(--fs-c2);       /* 12px — 고정 */
    line-height: 1.2;
    text-align: right;
    color: var(--c-helper);
    white-space: nowrap;
  }

  /* imageArea --------------------------------------------------- */
  /* 시안은 4칸짜리 row 3개 — 동일 결과이면서 삭제 시 자연스럽게 흐르도록 4열 그리드로 구현 */
  .image-area {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--mid-8);
    width: 100%;
  }
  .image-area .cell { position: relative; aspect-ratio: 1 / 1; }
  .image-area .add {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--mid-8);
    background: rgba(0, 0, 0, 0.8);
  }
  .image-area .add .plus { position: relative; width: 48px; height: 48px; overflow: hidden; }
  .image-area .add .plus img { position: absolute; inset: 25%; width: auto; height: auto; max-width: none; }
  .image-area .cell img.photo { width: 100%; height: 100%; object-fit: cover; }
  .image-area .remove {
    position: absolute;
    right: 0;
    top: 0;
    width: 20px;                   /* 토큰 없음 → px */
    height: 20px;
    background: rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  .image-area .remove .glyph {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 16px;
    height: 16px;
    overflow: hidden;
  }
  .image-area .remove .glyph img { position: absolute; inset: 29.85%; width: auto; height: auto; max-width: none; }

  /* ── buttonArea ──────────────────────────────────────────────── */
  .button-area {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    width: 100%;
    padding: var(--mid-12) var(--mid-24) var(--mid-24);
    background: #fff;
  }
  .button-area .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 100%;
    padding: 1.0769em 1.6923em;    /* 14px / 22px @ btn-large 13px — em */
    border: 1px solid transparent;
    background: #111;
    font-weight: 500;
    font-size: var(--fs-btn-l);    /* 13px — 고정 */
    line-height: 1.2;
    text-align: center;
    color: #fff;
    white-space: nowrap;
  }

  /* ── 데모 컨트롤 — 시안에 없는 요소. 삭제해도 무방 ───────────── */
  .demo-nav {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 500;
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 6px 8px;
    align-items: center;
    padding: 8px 10px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    font-size: 11px;
    line-height: 1.4;
    white-space: nowrap;
  }
  .demo-nav strong { font-size: 10px; letter-spacing: 0.04em; color: #999; text-transform: uppercase; }
  .demo-seg { display: flex; border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 3px; overflow: hidden; }
  .demo-seg button { padding: 4px 9px; color: #777; background: #fff; }
  .demo-seg button + button { border-left: 1px solid rgba(0, 0, 0, 0.1); }
  .demo-seg button.is-on { background: #111; color: #fff; font-weight: 600; }
  .demo-readout { color: #999; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="dim"></div>

<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">

  <div class="header">
    <p class="title" id="dialogTitle">리뷰 작성</p>
    <button type="button" class="icon-btn" aria-label="닫기">
      <span class="glyph"><img src="assets/close.svg" alt=""></span>
    </button>
  </div>

  <div class="body">
    <div class="content">

      <div class="product">
        <div class="thumb"><img src="assets/thumbnail.png" alt="포겟 미 낫 핸드 앤 바디 워시"></div>
        <div class="text-area">
          <p class="name">포겟 미 낫 핸드 앤 바디 워시</p>
          <p class="option">
            <span>400ml</span><span>/</span><span>Thank you</span><span>/</span><span>펌프</span>
          </p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="rating">
        <div class="stars" id="stars" role="radiogroup" aria-label="별점">
          <button type="button" class="star" data-score="1" aria-label="1점"><img src="assets/star-filled.svg" alt=""></button>
          <button type="button" class="star" data-score="2" aria-label="2점"><img src="assets/star-filled.svg" alt=""></button>
          <button type="button" class="star" data-score="3" aria-label="3점"><img src="assets/star-filled.svg" alt=""></button>
          <button type="button" class="star" data-score="4" aria-label="4점"><img src="assets/star-empty.svg" alt=""></button>
          <button type="button" class="star" data-score="5" aria-label="5점"><img src="assets/star-empty.svg" alt=""></button>
        </div>
      </div>

      <div class="multi-line">
        <div class="text-field">
          <textarea id="reviewText" maxlength="5000" aria-label="리뷰 내용">향기가 정말 좋고 세정력도 꽤 괜찮아요! 사용 후 피부가 부드럽고 촉촉해지는 느낌이 드네요. 특히, 향이 오래 지속되어 기분이 좋아지는 것 같아요. 매일 사용해도 부담이 없고, 가족 모두가 만족하고 있습니다. 앞으로도 계속 사용할 예정이에요!</textarea>
        </div>
        <div class="supporting">
          <span class="counter" id="counter">0/5,000</span>
        </div>
      </div>

      <div class="image-area" id="imageArea">
        <button type="button" class="cell add" aria-label="사진 추가">
          <span class="plus"><img src="assets/plus.svg" alt=""></span>
        </button>
      </div>

    </div>
  </div>

  <div class="button-area">
    <button type="button" class="btn">리뷰 등록</button>
  </div>

</div>

<!-- 데모 컨트롤 — 시안에 없는 요소 -->
<nav class="demo-nav" id="demoNav">
  <strong>title</strong>
  <div class="demo-seg" id="titleToggle">
    <button type="button" data-title-size="p1">P1</button>
    <button type="button" data-title-size="p2">P2</button>
    <button type="button" data-title-size="p3">P3</button>
    <button type="button" data-title-size="p4">P4</button>
  </div>
  <span class="demo-readout" id="titleReadout">–</span>

  <strong>box</strong>
  <div class="demo-seg" id="boxToggle">
    <button type="button" data-box="fixed-mid">560 + mid</button>
    <button type="button" data-box="fixed-px">560 + px</button>
    <button type="button" data-box="fluid-mid">vw + mid</button>
  </div>
  <span class="demo-readout" id="boxReadout">–</span>
</nav>

<script>
(() => {
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const TITLE_KEY = 'fw-b-review-dialog-title-size';
  const BOX_KEY   = 'fw-b-review-dialog-box';
  const DESIGN = { p1: 18, p2: 16, p3: 14, p4: 13 };   /* @1920 기준 px */
  const FIXED  = { p3: true, p4: true };               /* ≤ 1rem → 뷰포트와 무관하게 고정 */
  const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const load  = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };

  /* ── 업로드 이미지 11장 (시안과 동일한 수) ─────────────────── */
  const area = $('#imageArea');
  for (let i = 0; i < 11; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML =
      '<img class="photo" src="assets/thumbnail.png" alt="">' +
      '<button type="button" class="remove" aria-label="사진 삭제">' +
        '<span class="glyph"><img src="assets/close-white.svg" alt=""></span>' +
      '</button>';
    area.appendChild(cell);
  }
  area.addEventListener('click', e => {
    const rm = e.target.closest('.remove');
    if (rm) rm.closest('.cell').remove();
  });

  /* ── 별점 ──────────────────────────────────────────────────── */
  $('#stars').addEventListener('click', e => {
    const b = e.target.closest('.star');
    if (!b) return;
    const score = Number(b.dataset.score);
    $$('#stars .star').forEach(s => {
      const on = Number(s.dataset.score) <= score;
      $('img', s).src = on ? 'assets/star-filled.svg' : 'assets/star-empty.svg';
    });
  });

  /* ── 글자수 카운터 ─────────────────────────────────────────── */
  const ta = $('#reviewText');
  const counter = () => { $('#counter').textContent = `${ta.value.length}/${(5000).toLocaleString('en-US')}`; };
  ta.addEventListener('input', counter);
  counter();

  /* ── 타이틀 사이즈 · box 안 (데모) ─────────────────────────── */
  function setTitleSize(size) {
    document.body.dataset.title = size;
    $$('#titleToggle button').forEach(b => b.classList.toggle('is-on', b.dataset.titleSize === size));
    store(TITLE_KEY, size);
    readout();
  }

  function setBox(mode) {
    document.body.dataset.box = mode;
    $$('#boxToggle button').forEach(b => b.classList.toggle('is-on', b.dataset.box === mode));
    store(BOX_KEY, mode);
    readout();
  }

  function readout() {
    const size = document.body.dataset.title;
    const fs = parseFloat(getComputedStyle($('.header .title')).fontSize);
    $('#titleReadout').textContent =
      `${DESIGN[size]}px @1920${FIXED[size] ? ' (고정)' : ''} · ${fs.toFixed(1)}px`;

    const w = $('.dialog').getBoundingClientRect().width;
    const pad = parseFloat(getComputedStyle($('.content')).paddingLeft);
    const note = document.body.dataset.box === 'fluid-mid' ? ' (29.1667vw)' : '';
    $('#boxReadout').textContent =
      `${w.toFixed(1)}px${note} · pad ${pad.toFixed(1)}px · ${innerWidth}px`;
  }

  $('#titleToggle').addEventListener('click', e => {
    const b = e.target.closest('[data-title-size]');
    if (b) setTitleSize(b.dataset.titleSize);
  });
  $('#boxToggle').addEventListener('click', e => {
    const b = e.target.closest('[data-box]');
    if (b) setBox(b.dataset.box);
  });
  window.addEventListener('resize', readout);

  setTitleSize(load(TITLE_KEY, 'p2'));
  setBox(load(BOX_KEY, 'fixed-mid'));
})();
</script>

</body>
</html>

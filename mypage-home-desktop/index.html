<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Page — Desktop (Framework B)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ─────────────────────────────────────────────────────────────
     Unit system — desktop (viewport ≥ 768)
     디자인 기준 폭: 1920

     1) Typography
        font-size = (size value − 1) × 0.0083 × screen width + 1rem
        · size value = rem (1rem = 14px), 0.0083 × screen width = 0.83vw
        · size value ≤ 1rem(14px) 은 뷰포트와 무관하게 px 고정
     2) Spacing
        · mid-* : (값 − 8) × 100vw / 1920 + 8, 값 < 8 이면 값 그대로 고정
        · px-*  : px 고정
     3) 버튼 padding = em (해당 버튼의 label 사이즈 기준)
     4) 그 외 = px
     5) Font — 영문 Work Sans / 국문 Pretendard (--font 스택의 폴백으로 자동 분기)

     ※ 이 화면의 확인 목적
       섹션 content 의 min-height 가 뷰포트별로 적절한지.
       우하단 패널에서 주문 건수(0~3), min-height 방식(mid 공식 / px 고정 / 해제),
       그리고 그 값을 직접 입력해 비교할 수 있다. 기본값은 mid-120.
       읽기값에 계산값·실제 콘텐츠 높이·적용 여부가 표시된다.
     ───────────────────────────────────────────────────────────── */
  :root {
    /* 기준 단위 -------------------------------------------------- */
    --us: calc(100vw / 1920);       /* spacing 1px (mid-* 계산용) */

    /* Typography ------------------------------------------------- */
    --fs-c2:    12px;               /* caption-2          0.857rem → 고정 */
    --fs-p4:    13px;               /* paragraph-4        0.929rem → 고정 */
    --fs-p3:    14px;               /* paragraph-3        1rem     → 고정 */
    --fs-btn-l: 13px;               /* button-label-large 0.929rem → 고정 */
    --fs-p1:    calc((1.2857 - 1) * 0.83vw + 1rem);   /* paragraph-1 18px @1920 — 가변 */
    --fs-logo:  calc((1.4286 - 1) * 0.83vw + 1rem);   /* 로고        20px @1920 — 가변 */

    /* Spacing — mid-* : (값 − 8) × 100vw / 1920 + 8 ---------------- */
    --mid-4:   4px;                 /* 값 < 8 → 값 그대로 고정 */
    --mid-6:   6px;
    --mid-8:   8px;                 /* 공식 결과도 8px (증감 없음) */
    --mid-12:  calc(  4 * var(--us) + 8px);
    --mid-16:  calc(  8 * var(--us) + 8px);
    --mid-24:  calc( 16 * var(--us) + 8px);
    --mid-32:  calc( 24 * var(--us) + 8px);
    --mid-40:  calc( 32 * var(--us) + 8px);
    --mid-56:  calc( 48 * var(--us) + 8px);
    --mid-72:  calc( 64 * var(--us) + 8px);
    --mid-80:  calc( 72 * var(--us) + 8px);
    --mid-100: calc( 92 * var(--us) + 8px);
    --mid-120: calc(112 * var(--us) + 8px);
    --mid-160: calc(152 * var(--us) + 8px);
    /* px-* : 뷰포트와 무관하게 px 고정 */
    --px-12:   12px;

    /* 검증 대상 — 섹션 content 의 min-height
       --minh-val 은 데모 패널이 body 에 숫자로 심는다 (기본 120) */
    --minh-val: 120;
    --section-min-h: max(0px, calc((var(--minh-val) - 8) * var(--us) + 8px));

    /* Grid — 12컬럼 / 거터 16px / 좌우 19px (모두 px) --------------- */
    --grid-gutter: 16px;
    --page-pad: 19px;

    /* Font / Color ----------------------------------------------- */
    --font: "Work Sans", "Pretendard Variable", Pretendard, sans-serif;
    --c-text: #111;
    --c-sub: #6a6a6a;
    --c-muted: rgba(17, 17, 17, 0.5);
    --c-header-text: #372320;
    --c-line: rgba(0, 0, 0, 0.1);
  }

  /* min-height 안 전환 (데모) — mid 공식 / px 고정 / 해제 */
  body[data-minh="mid"] { --section-min-h: max(0px, calc((var(--minh-val) - 8) * var(--us) + 8px)); }
  body[data-minh="px"]  { --section-min-h: calc(var(--minh-val) * 1px); }
  body[data-minh="off"] { --section-min-h: 0px; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    font-size: 14px;               /* 1rem = 14px */
  }
  body {
    font-family: var(--font);
    color: var(--c-text);
    background: #fff;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  img { display: block; }
  a { color: inherit; text-decoration: none; }

  /* ── set06_header ────────────────────────────────────────────── */
  .header {
    position: sticky;
    top: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 var(--px-12);
    background: #fff;
  }
  .header .container {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    flex: 1 0 0;
    min-width: 0;
    align-items: center;
    height: 64px;                  /* 토큰 없음 → px */
  }
  .header .nav,
  .header .utilities { display: flex; gap: 12px; height: 100%; align-items: stretch; }
  .header .utilities { justify-content: flex-end; }
  .header .depth1 {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8px;
    font-size: var(--fs-p4);       /* 13px — 고정 */
    line-height: normal;
    text-transform: uppercase;
    color: var(--c-header-text);
    white-space: nowrap;
  }
  .header .logo {
    font-weight: 600;
    font-size: var(--fs-logo);     /* 20px @1920 — 가변 */
    line-height: 1.4;
    color: var(--c-header-text);
    white-space: nowrap;
  }

  /* ── contentArea ─────────────────────────────────────────────── */
  .content-area { padding: 0 var(--page-pad); background: #fff; }

  .title-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--mid-56) 0;
    border-bottom: 1px solid var(--c-line);
  }
  .title-area h1 {
    width: 100%;
    font-weight: 500;
    font-size: var(--fs-p1);       /* 18px @1920 — 가변 */
    line-height: 1.5;
    color: var(--c-text);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: var(--grid-gutter);
  }
  .tab-area { grid-column: 1 / span 3; padding-top: var(--mid-72); }
  .main     { grid-column: 4 / span 6; padding-top: var(--mid-80); padding-bottom: var(--mid-160); }

  /* ── tabs ────────────────────────────────────────────────────── */
  .tabs { display: flex; flex-direction: column; width: 100%; }
  .tabs .tab {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 8px 0;                /* 토큰 없음 → px */
    font-size: var(--fs-p4);       /* 13px — 고정 */
    line-height: 1.6;
    color: var(--c-text);
    text-align: left;
    white-space: nowrap;
  }
  .tabs .tab:not(.is-active) { opacity: 0.4; }

  /* ── greeting ────────────────────────────────────────────────── */
  .greeting-area {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--mid-8);
    width: 100%;
    padding-bottom: var(--mid-40);
  }
  .greeting-area .line {
    display: flex;
    align-items: flex-start;
    width: 100%;
    font-size: var(--fs-p1);       /* 18px @1920 — 가변 */
    line-height: 1.5;
    color: var(--c-text);
    white-space: nowrap;
  }
  .greeting-area .desc {
    width: 100%;
    font-size: var(--fs-p3);       /* 14px — 고정 */
    line-height: 1.6;
    color: var(--c-sub);
  }

  /* ── section (recentOrderHistory / profileInfo) ──────────────── */
  .section {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    padding: var(--mid-32) 0;
  }
  .section-head {
    display: flex;
    align-items: center;
    gap: var(--mid-24);
    width: 100%;
    padding-bottom: var(--mid-16);
    border-bottom: 1px solid var(--c-line);
  }
  .section-head .t {
    flex: 1 0 0;
    min-width: 0;
    font-weight: 500;
    font-size: var(--fs-p3);       /* 14px — 고정 */
    line-height: 1.6;
    color: var(--c-text);
  }
  .link-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1px 0 2px;            /* 토큰 없음 → px */
    border-bottom: 1px solid var(--c-text);
    font-weight: 500;
    font-size: var(--fs-btn-l);    /* 13px — 고정 */
    line-height: 1.2;
    color: var(--c-text);
    white-space: nowrap;
  }
  /* ★ 검증 대상 — 섹션 content 의 min-height */
  .section-body {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    min-height: var(--section-min-h);
    padding-top: var(--mid-24);
  }
  .section-body.orders  { gap: var(--mid-12); }
  .section-body.profile { gap: var(--mid-32); }
  .section-body .empty {
    width: 100%;
    font-size: var(--fs-p3);       /* 14px — 고정 */
    line-height: 1.6;
    color: var(--c-muted);
  }

  /* ── recentOrderHistoryItem ──────────────────────────────────── */
  .order {
    display: flex;
    align-items: flex-start;
    gap: var(--mid-16);
    width: 100%;
  }
  .order .thumb { flex-shrink: 0; position: relative; width: 72px; height: 72px; overflow: hidden; }
  .order .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .order .body {
    display: flex;
    flex: 1 0 0;
    min-width: 0;
    align-items: flex-end;
    gap: var(--mid-24);
  }
  .order .text {
    display: flex;
    flex: 1 0 0;
    min-width: 0;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--mid-6);
  }
  .order .date {
    font-size: var(--fs-c2);       /* 12px — 고정 */
    line-height: 1.2;
    color: var(--c-sub);
    white-space: nowrap;
  }
  .order .name {
    display: flex;
    align-items: flex-start;
    gap: var(--mid-4);
    width: 100%;
    font-weight: 500;
    font-size: var(--fs-p4);       /* 13px — 고정 */
    line-height: 1.6;
    color: var(--c-text);
    white-space: nowrap;
  }
  .order .name > * { overflow: hidden; text-overflow: ellipsis; }
  .order .price {
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    font-weight: 500;
    font-size: var(--fs-p4);       /* 13px — 고정 */
    line-height: 1.6;
    color: var(--c-text);
    text-align: right;
    white-space: nowrap;
  }
  /* 컴포넌트 정의: price 의 숫자 영역(value) min width = 10ch */
  .order .price .num { min-width: 10ch; }

  /* ── profileInfo ─────────────────────────────────────────────── */
  .info-block { display: flex; flex-direction: column; align-items: flex-start; gap: var(--mid-12); width: 100%; }
  .info-block .label {
    width: 100%;
    font-size: var(--fs-p4);       /* 13px — 고정 */
    line-height: 1.6;
    color: var(--c-sub);
  }
  .info-block .values { display: flex; flex-direction: column; gap: var(--mid-8); width: 100%; }
  .info-block .values p {
    width: 100%;
    font-size: var(--fs-p3);       /* 14px — 고정 */
    line-height: 1.6;
    color: var(--c-text);
  }
  .info-block .row { display: flex; align-items: center; gap: var(--mid-8); width: 100%; }
  .info-block .row span { font-size: var(--fs-p3); line-height: 1.6; white-space: nowrap; }
  .divider { flex-shrink: 0; width: 1px; height: 12px; background: var(--c-line); }

  /* ── 데모 컨트롤 — 시안에 없는 요소. 삭제해도 무방 ───────────── */
  .demo-nav {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 500;
    display: grid;
    grid-template-columns: auto auto;
    gap: 6px 8px;
    align-items: center;
    padding: 8px 10px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    font-size: 11px;
    line-height: 1.4;
    white-space: nowrap;
  }
  .demo-nav strong { font-size: 10px; letter-spacing: 0.04em; color: #999; text-transform: uppercase; }
  .demo-seg { display: flex; border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 3px; overflow: hidden; }
  .demo-seg button { padding: 4px 9px; color: #777; background: #fff; }
  .demo-seg button + button { border-left: 1px solid rgba(0, 0, 0, 0.1); }
  .demo-seg button.is-on { background: #111; color: #fff; font-weight: 600; }
  .demo-value { display: flex; align-items: center; gap: 6px; color: #777; }
  .demo-value input[type="number"] {
    width: 58px;
    padding: 3px 5px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 3px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: #111;
  }
  .demo-value input[type="number"]:disabled { color: #bbb; background: #fafafa; }
  .demo-value.is-off { opacity: 0.55; }
  .demo-value .calc { font-variant-numeric: tabular-nums; }
  .demo-readout {
    grid-column: 1 / -1;
    padding-top: 2px;
    border-top: 1px solid rgba(0, 0, 0, 0.08);
    margin-top: 2px;
    color: #999;
    font-variant-numeric: tabular-nums;
  }
  .demo-readout b { color: #111; font-weight: 600; }
</style>
</head>
<body>

<header class="header">
  <div class="container">
    <nav class="nav">
      <a class="depth1" href="#">Shop</a>
      <a class="depth1" href="#">About</a>
      <a class="depth1" href="#">Journal</a>
      <a class="depth1" href="#">Info</a>
      <a class="depth1" href="#">The Story</a>
    </nav>
    <div class="logo">BRAND</div>
    <div class="utilities">
      <a class="depth1" href="#">Search</a>
      <a class="depth1" href="#">Sign in</a>
      <a class="depth1" href="#">Bag [0]</a>
    </div>
  </div>
</header>

<div class="content-area">

  <div class="title-area">
    <h1>마이페이지</h1>
  </div>

  <div class="grid">
    <div class="tab-area">
      <nav class="tabs">
        <button type="button" class="tab is-active">홈</button>
        <button type="button" class="tab">주문내역</button>
        <button type="button" class="tab">위시리스트</button>
        <button type="button" class="tab">쿠폰</button>
        <button type="button" class="tab">리뷰</button>
        <button type="button" class="tab">프로필</button>
      </nav>
    </div>

    <div class="main">

      <div class="greeting-area">
        <p class="line"><span>홍길동</span><span>님, 안녕하세요</span></p>
        <p class="desc">마이페이지에서 나의 쇼핑 정보를 확인해보세요</p>
      </div>

      <section class="section">
        <div class="section-head">
          <p class="t">최근 주문내역</p>
          <button type="button" class="link-btn">전체보기</button>
        </div>
        <div class="section-body orders" id="orderBody"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <p class="t">프로필</p>
          <button type="button" class="link-btn">프로필 관리</button>
        </div>
        <div class="section-body profile">
          <div class="info-block">
            <p class="label">내 정보</p>
            <div class="values">
              <p>홍길동</p>
              <p>010-1234-1234</p>
            </div>
          </div>
          <div class="info-block">
            <p class="label">배송지</p>
            <div class="values">
              <p>[00000] 서울 마포구 양화로 147 아일렉스빌딩 413호</p>
              <div class="row">
                <span>홍길동</span>
                <span class="divider"></span>
                <span>010-1234-1234</span>
              </div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- 데모 컨트롤 — 시안에 없는 요소 -->
<nav class="demo-nav" id="demoNav">
  <strong>orders</strong>
  <div class="demo-seg" id="orderToggle">
    <button type="button" data-orders="0">0</button>
    <button type="button" data-orders="1">1</button>
    <button type="button" data-orders="2">2</button>
    <button type="button" data-orders="3">3</button>
  </div>

  <strong>min-h</strong>
  <div class="demo-seg" id="minhToggle">
    <button type="button" data-minh="mid">mid</button>
    <button type="button" data-minh="px">px</button>
    <button type="button" data-minh="off">off</button>
  </div>

  <strong>값</strong>
  <div class="demo-value" id="minhValueWrap">
    <input type="number" id="minhValue" min="0" max="400" step="4" value="120">
    <span class="calc" id="minhCalc">–</span>
  </div>

  <p class="demo-readout" id="readout">–</p>
</nav>

<script>
(() => {
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ORDERS_KEY = 'fw-b-mypage-orders';
  const MINH_KEY   = 'fw-b-mypage-minh-v3';   /* mid 값 직접 입력 방식으로 변경 */
  const MINH_VAL_KEYS = { mid: 'fw-b-mypage-minh-mid-v3', px: 'fw-b-mypage-minh-px-v3' };
  const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const load  = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };

  /* 시안의 주문 3건 */
  const ORDERS = [
    { img: 'assets/order-1.png', date: '2025. 12. 31.', name: '포겟 미 낫 핸드 앤 바디 워시', more: 1, price: '208,000' },
    { img: 'assets/order-2.png', date: '2025. 11. 31.', name: '베르가못 너리싱 비건 립밤',   more: 1, price: '120,000' },
    { img: 'assets/order-3.png', date: '2025. 11. 21.', name: '핸드 앤 립 케어 듀오 세트',   more: 0, price: '40,000'  },
  ];

  function renderOrders(n) {
    const body = $('#orderBody');
    if (n === 0) {
      body.innerHTML = '<p class="empty">최근 주문내역이 없습니다</p>';
    } else {
      body.innerHTML = ORDERS.slice(0, n).map(o => `
        <div class="order">
          <div class="thumb"><img src="${o.img}" alt=""></div>
          <div class="body">
            <div class="text">
              <p class="date">${o.date}</p>
              <p class="name"><span>${o.name}</span>${o.more ? `<span>외</span><span><span class="num-inline">${o.more}</span>건</span>` : ''}</p>
            </div>
            <p class="price"><span class="num">${o.price}</span><span>원</span></p>
          </div>
        </div>`).join('');
    }
  }

  function setOrders(n) {
    document.body.dataset.orders = n;
    $$('#orderToggle button').forEach(b => b.classList.toggle('is-on', b.dataset.orders === String(n)));
    store(ORDERS_KEY, String(n));
    renderOrders(n);
    readout();
  }

  const clampVal = () => {
    const raw = parseFloat($('#minhValue').value);
    return Number.isFinite(raw) ? Math.min(400, Math.max(0, raw)) : null;
  };

  function applyMinH() {
    const mode = document.body.dataset.minh;
    const val = clampVal();
    const off = mode === 'off';
    $('#minhValue').disabled = off;
    $('#minhValueWrap').classList.toggle('is-off', off);
    if (val !== null) {
      document.body.style.setProperty('--minh-val', String(val));
      if (mode !== 'off') store(MINH_VAL_KEYS[mode], String(val));
    }
    $('#minhCalc').textContent =
      off ? '해제' : mode === 'px' ? `${val}px 고정` : `mid-${val}`;
    readout();
  }

  function setMinH(mode) {
    document.body.dataset.minh = mode;
    $$('#minhToggle button').forEach(b => b.classList.toggle('is-on', b.dataset.minh === mode));
    store(MINH_KEY, mode);
    /* 모드별로 마지막 값을 기억 — mid 는 120, px 도 120 이 기본 */
    if (mode !== 'off') $('#minhValue').value = load(MINH_VAL_KEYS[mode], '120');
    applyMinH();
  }

  function readout() {
    const body = $('#orderBody');
    const cs = getComputedStyle(body);
    const minH = parseFloat(cs.minHeight) || 0;
    /* min-height 를 잠시 해제해 실제 콘텐츠 높이를 잰다 */
    const prev = body.style.minHeight;
    body.style.minHeight = '0px';
    const natural = body.getBoundingClientRect().height;
    body.style.minHeight = prev;
    const applied = body.getBoundingClientRect().height;
    const binding = minH > natural + 0.5;
    $('#readout').innerHTML =
      `min-h <b>${minH.toFixed(1)}px</b> · 콘텐츠 <b>${natural.toFixed(1)}px</b> · ` +
      `실제 <b>${applied.toFixed(1)}px</b> → ${binding ? '<b>min 적용</b>' : '콘텐츠가 더 큼'}` +
      `<br>viewport ${innerWidth}px`;
  }

  $('#orderToggle').addEventListener('click', e => {
    const b = e.target.closest('[data-orders]');
    if (b) setOrders(Number(b.dataset.orders));
  });
  $('#minhToggle').addEventListener('click', e => {
    const b = e.target.closest('[data-minh]');
    if (b) setMinH(b.dataset.minh);
  });
  $('#minhValue').addEventListener('input', applyMinH);
  $('#minhValue').addEventListener('change', () => {
    const v = clampVal();
    if (v !== null) $('#minhValue').value = v;   /* 범위 밖 입력은 확정 시 보정 */
    applyMinH();
  });
  window.addEventListener('resize', readout);

  window.__matrix = (cases) => {
    const body = $('#orderBody');
    const out = { vw: innerWidth };
    cases.forEach(([mode, val]) => {
      setMinH(mode);
      $('#minhValue').value = val;
      applyMinH();
      const minH = parseFloat(getComputedStyle(body).minHeight) || 0;
      const rows = {};
      [0, 1, 2, 3].forEach(n => {
        setOrders(n);
        const prev = body.style.minHeight;
        body.style.minHeight = '0px';
        const nat = body.getBoundingClientRect().height;
        body.style.minHeight = prev;
        const app = body.getBoundingClientRect().height;
        rows[n] = `${nat.toFixed(1)} → ${app.toFixed(1)}${minH > nat + 0.5 ? ' (min)' : ''}`;
      });
      out[`${mode}-${val}`] = { minH: +minH.toFixed(2), rows };
    });
    setMinH('mid'); setOrders(1);
    return out;
  };

  setOrders(Number(load(ORDERS_KEY, '1')));
  setMinH(load(MINH_KEY, 'mid'));
})();
</script>

</body>
</html>
